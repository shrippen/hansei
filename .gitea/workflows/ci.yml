# Checks on every pull request and on main: gofmt, vet, go test -race (make check) and the
# release gate (scripts/check-release.sh: builds the Go binary and the KDE app as they ship and
# fails on demo leftovers).
#
# Arch Linux container: current Go, Qt 6 and KF6 from the packages, as on the development machine.
#
# This same file lives in .gitea/workflows and .github/workflows: Gitea reads only .gitea/workflows
# as soon as it exists, GitHub only ever reads .github/workflows. Kept as two files, so a change
# here is a reminder to update the other one too.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One runner works the queue in order. A newer push to the same branch or PR replaces the
# older run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 40
    steps:
      - name: Tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git nodejs go cmake ninja gettext \
            extra-cmake-modules qt6-base qt6-declarative ki18n kcoreaddons knotifications
      - uses: actions/checkout@v4
      - name: gofmt, vet, tests (make check)
        run: make check
      - name: Release gate (Go binary and KDE app without demo)
        run: scripts/check-release.sh ci
